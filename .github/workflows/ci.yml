name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nobody needs the results of a commit
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms are reported even when one fails - "does it break
      # everywhere or only on Linux?" is the first question worth answering.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # PySide6 wheels ship Qt itself, but not the system libraries Qt links
      # against. A desktop Ubuntu has these; a CI runner does not.
      - name: Install Qt's system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libnss3 libnspr4 libasound2t64 libxcomposite1 libxdamage1 \
            libxrandr2 libxfixes3 libxcursor1 libxi6 libxtst6 libcups2t64 \
            libdrm2 libgbm1 libpango-1.0-0 libcairo2 libatk1.0-0 \
            libatk-bridge2.0-0 libatspi2.0-0 libxcb-cursor0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Test
        env:
          # No display on a runner. The geometry test skips itself under
          # offscreen (it cannot observe a resize there) - see
          # tests/test_main_window.py.
          QT_QPA_PLATFORM: offscreen
          # Chromium cannot use its sandbox or a GPU in this environment.
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: uv run pytest -q

  # Kept out of `test` so a packaging break is distinguishable at a glance
  # from a test failure, and so it runs once rather than per platform.
  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Both licences must ship in the wheel
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = [
              "qtxterm-0.1.0.dist-info/licenses/LICENSE",
              "qtxterm-0.1.0.dist-info/licenses/src/qtxterm/assets/xterm/LICENSE",
          ]
          missing = [name for name in expected if name not in names]
          if missing:
              sys.exit(f"missing from {wheel}: {missing}")
          print(f"{wheel}: both licences present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
