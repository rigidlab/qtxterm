<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="qtxterm">
  <title>qtxterm</title>

  <!-- Terminal window body. Near-black to match the VS Code Dark High
       Contrast default; the border keeps the silhouette readable when the
       icon sits on a dark taskbar. -->
  <rect x="24" y="32" width="208" height="192" rx="26"
        fill="#0d0d0d" stroke="#4a4a4a" stroke-width="5"/>

  <!-- Title bar: three dots above a separator. -->
  <circle cx="50" cy="52" r="5.5" fill="#4d4d4d"/>
  <circle cx="72" cy="52" r="5.5" fill="#4d4d4d"/>
  <circle cx="94" cy="52" r="5.5" fill="#4d4d4d"/>
  <line x1="26" y1="72" x2="230" y2="72" stroke="#2b2b2b" stroke-width="3"/>

  <!-- Prompt: chevron and an underscore cursor sharing the baseline at
       y=182. The chevron is a step dimmer than the cursor so the two read as
       prompt and caret rather than one shape. -->
  <polyline points="73,114 107,148 73,182"
            fill="none" stroke="#e5e5e5" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="136" y="168" width="56" height="14" rx="7" fill="#ffffff"/>
</svg>
