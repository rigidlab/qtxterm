<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="xterm/xterm.css" />
<style>
  /* Background is set from the theme by terminal.js - this is only the
     pre-script ground, kept neutral so no theme flashes the wrong color. */
  html, body { margin: 0; padding: 0; height: 100%; }
  /* Sized in pixels from Qt (terminal.js window.applySize); the percentage
     is only what it starts at. overflow:hidden because that pixel size can
     briefly exceed the viewport Chromium believes it has, and a scrollbar
     flickering in over the terminal is worse than a frame of clipping. */
  body { overflow: hidden; }
  #terminal { height: 100%; }

  /* The scrollbar is styled from terminal.js, not here: Chromium does not
     resolve CSS custom properties inside ::-webkit-scrollbar-* pseudo
     elements, so a var() rule silently falls back and never follows the
     theme. */
</style>
</head>
<body>
<div id="terminal"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script src="terminal.js"></script>
</body>
</html>
