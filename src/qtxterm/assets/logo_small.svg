<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="qtxterm">
  <title>qtxterm</title>

  <!-- Small-size variant of logo.svg: same mark with the window frame, title
       dots and typed line dropped, and everything scaled up. At 16-24px those
       details collapse into a smudge; chevron plus cursor still reads. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#0d0d0d"/>

  <!-- The gap between chevron and cursor is held wide on purpose: at 16px it
       is barely over a pixel, and any less closes up into one blob. -->
  <polyline points="73,74 129,128 73,182"
            fill="none" stroke="#2fe664" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="163" y="96" width="34" height="86" fill="#ffffff"/>
</svg>
