[project]
name = "qtxterm"
version = "1.0.0"
description = "Cross-platform GUI terminal (PySide6 + xterm.js)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/qtxterm/assets/xterm/LICENSE"]
keywords = ["terminal", "pyside6", "xterm", "pty", "conpty", "wsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.11.0",
    "ptyprocess>=0.7 ; sys_platform != 'win32'",
    "pyside6>=6.7",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
]

[project.scripts]
# The dev entry point: run from a terminal, it inherits that terminal and
# prints there. Deliberately console, because uv's *venv* pythonw.exe is a
# console-subsystem trampoline - a gui-script in a venv therefore has no
# console to inherit, so Windows allocates one and the default terminal app
# pops up a window alongside the GUI.
qtxterm = "qtxterm.app:main"

[project.gui-scripts]
# The shortcut/taskbar entry point, and what install-shortcut.ps1 targets.
# Console-less, so starting the app from a shortcut doesn't leave a stray cmd
# window behind it. Named after the python/pythonw convention.
qtxtermw = "qtxterm.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtxterm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The soak test is measured in minutes, so it stays out of the default run.
# `uv run pytest -m soak` opts in; see tests/test_soak.py.
addopts = "-m 'not soak'"
markers = [
    "soak: long-running reliability test (memory, handles, lag over time)",
]
