[project]
name = "mterm"
version = "0.1.0"
description = "Cross-platform GUI terminal (PySide6 + xterm.js)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ptyprocess>=0.7 ; sys_platform != 'win32'",
    "pyside6>=6.7",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
]

[project.scripts]
mterm = "mterm.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mterm"]
