[project]
name = "qtxterm"
version = "0.1.0"
description = "Cross-platform GUI terminal (PySide6 + xterm.js)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.11.0",
    "ptyprocess>=0.7 ; sys_platform != 'win32'",
    "pyside6>=6.7",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
]

[project.scripts]
qtxterm = "qtxterm.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtxterm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
